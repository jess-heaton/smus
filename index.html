<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTLGNC Chatbot Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
        }
        main {
            margin: 50px auto;
            max-width: 800px;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            text-align: left;
        }
        a {
            color: #004aad;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <h1>NTLGNC</h1>
        
        <p>Adanac.ai is now rebranded as NTLGNC.com. We are a self-service FAQ bot building platform.</p>
        
// Add this div where you want the chatbox to appear

<div id="flat-chat" style="width: 80%; height: 600px; border: 1px solid #ccc; border-radius: 12px; overflow: hidden;"></div>

    </main>

    
//  Add this before the closing </body> tag

<script>
  const FormExtension = {
    name: 'Forms',
    type: 'response',
    match: ({ trace }) =>
      trace.type === 'Custom_Form' || trace.payload.name === 'Custom_Form',
    render: ({ trace, element }) => {
      const formContainer = document.createElement('form');

      formContainer.innerHTML = `
        <style>
          label {
            font-size: 0.8em;
            color: #888;
          }
          input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            border: none;
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            background: transparent;
            margin: 5px 0;
            outline: none;
            padding: 8px 0;
          }
          .invalid {
            border-color: red;
          }
          .submit {
            background: linear-gradient(to right, #2e6ee1, #2e7ff1);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
          }
        </style>

        <label for="name">Name</label>
        <input type="text" class="name" name="name" required><br><br>

        <label for="phone">Phone Number</label>
        <input type="tel" class="phone" name="phone" required pattern="\\+?[0-9\\- ]+" title="Invalid phone number"><br><br>

        <label for="email">Work Email</label>
        <input type="email" class="email" name="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}$" title="Invalid email address"><br><br>

        <label for="company">Company Name</label>
        <input type="text" class="company" name="company" required><br><br>

        <input type="submit" class="submit" value="Submit">
      `;

      formContainer.addEventListener('submit', function (event) {
        event.preventDefault();

        const name = formContainer.querySelector('.name');
        const phone = formContainer.querySelector('.phone');
        const email = formContainer.querySelector('.email');
        const company = formContainer.querySelector('.company');

        window.voiceflow.chat.interact({
          type: 'complete',
          payload: {
            name: name.value,
            phone: phone.value,
            email: email.value,
            company: company.value,
          },
        });
      });

      element.appendChild(formContainer);
    },
  };

  // Load the embedded chat widget
  (function (d, t) {
    var v = d.createElement(t),
      s = d.getElementsByTagName(t)[0];
    v.onload = function () {
      window.voiceflow.chat.load({
        verify: { projectID: '675cb8a7bdfd5f757ce98441' },
        url: 'https://general-runtime.voiceflow.com',
        versionID: 'production',
        render: {
          mode: 'embedded',
          target: document.getElementById('flat-chat'),
        },
        autostart: true,
        assistant: { extensions: [FormExtension] },
      });
    };
    v.src = 'https://cdn.voiceflow.com/widget/bundle.mjs';
    v.type = 'text/javascript';
    s.parentNode.insertBefore(v, s);
  })(document, 'script');
</script>


</body>
</html>
